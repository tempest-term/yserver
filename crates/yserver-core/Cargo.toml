[package]
name = "yserver-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
yserver-protocol.workspace = true
log.workspace = true
libc = { workspace = true, optional = true }
crossbeam-channel.workspace = true
mio = { version = "1", features = ["os-poll"] }

[dev-dependencies]
proptest = "1"

[features]
default = ["native"]
# Unix host backends, socket listeners, shared memory and descriptor passing.
native = ["dep:libc", "mio/net", "mio/os-ext"]
xdmcp = ["native", "yserver-protocol/xdmcp"]

[lints]
workspace = true
